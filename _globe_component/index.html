<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 460px; background: #000; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 460px; }
  #title {
    position: absolute; top: 10px; left: 0; right: 0; text-align: center;
    color: rgba(255,255,255,0.3); font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    z-index: 10; pointer-events: none; user-select: none;
  }
  #hint {
    position: absolute; bottom: 8px; left: 12px;
    color: rgba(255,255,255,0.2); font-size: 10px; letter-spacing: 0.05em;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    z-index: 10; pointer-events: none; user-select: none;
  }
  #tooltip {
    position: absolute; pointer-events: none; display: none;
    background: rgba(0,0,0,0.88); border: 1px solid rgba(255,255,255,0.12);
    color: #e8eaf0; font-size: 12px; padding: 6px 10px; border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    z-index: 20; white-space: nowrap; line-height: 1.5;
  }
  canvas { display: block; }
</style>
</head>
<body>
<div id="wrap">
  <div id="title">🌍 Couverture mondiale · cliquez pour filtrer</div>
  <canvas id="globe"></canvas>
  <div id="hint">Drag · Clic pour filtrer</div>
  <div id="tooltip"></div>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
// ── Streamlit protocol ────────────────────────────────────────────────────────
function _post(msg) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), '*'); }
function setComponentValue(v) { _post({ type: 'streamlit:setComponentValue', value: v }); }
function setFrameHeight(h)    { _post({ type: 'streamlit:setFrameHeight',    height: h }); }
function componentReady()     { _post({ type: 'streamlit:componentReady',    apiVersion: 1 }); }

// ── Color gradient (dark blue → cyan → orange → red) ─────────────────────────
const COLOR_STOPS = [
  [0.00, [13,  59,  94]],
  [0.15, [0,  119, 182]],
  [0.40, [0,  180, 216]],
  [0.70, [244, 162,  97]],
  [1.00, [230,  57,  70]],
];
function lerpColor(t) {
  for (let i = 1; i < COLOR_STOPS.length; i++) {
    if (t <= COLOR_STOPS[i][0]) {
      const f = (t - COLOR_STOPS[i-1][0]) / (COLOR_STOPS[i][0] - COLOR_STOPS[i-1][0]);
      return COLOR_STOPS[i-1][1].map((c, k) => Math.round(c + (COLOR_STOPS[i][1][k] - c) * f));
    }
  }
  return COLOR_STOPS[COLOR_STOPS.length - 1][1];
}

// ── Global state ──────────────────────────────────────────────────────────────
let args = { iso_counts: {}, iso_to_name: {}, selected_iso: null };
let countryFeatures = [];
let allDots = [];        // { lng, lat, iso3 }
let rotation = [0, -20, 0];
let autoRotate = true;

// ── Canvas & projection setup ─────────────────────────────────────────────────
const canvas = document.getElementById('globe');
const ctx    = canvas.getContext('2d');
const W      = Math.max(window.innerWidth || 0, 320);
const H      = 460;
const dpr    = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * dpr;
canvas.height = H * dpr;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';
ctx.scale(dpr, dpr);

const RADIUS = Math.min(W, H) * 0.43;
const projection = d3.geoOrthographic()
  .scale(RADIUS)
  .translate([W / 2, H / 2])
  .clipAngle(90)
  .rotate(rotation);

const pathGen   = d3.geoPath().projection(projection).context(ctx);
const graticule = d3.geoGraticule()();
const sphere    = { type: 'Sphere' };

// ── Dot color helper ──────────────────────────────────────────────────────────
function dotColor(iso3) {
  if (iso3 === args.selected_iso) return [255, 214, 10];
  const vals = Object.values(args.iso_counts).filter(Number.isFinite);
  const max  = Math.max(1, ...vals);
  const c    = args.iso_counts[iso3] || 0;
  if (!c) return null; // will use dim default
  return lerpColor(c / max);
}

// ── Visibility check (front hemisphere) ──────────────────────────────────────
function isVisible(lng, lat) {
  const cx = -rotation[0], cy = -rotation[1];
  return d3.geoDistance([lng, lat], [cx, cy]) < Math.PI / 2;
}

// ── Main render ───────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, W, H);

  // Ocean
  ctx.beginPath();
  pathGen(sphere);
  ctx.fillStyle = '#000000';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Graticule
  ctx.beginPath();
  pathGen(graticule);
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Country borders
  ctx.beginPath();
  countryFeatures.forEach(f => pathGen(f));
  ctx.strokeStyle = 'rgba(255,255,255,0.16)';
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Halftone dots — batch by color for performance
  const bright = [], dim = [], sel = [];
  allDots.forEach(dot => {
    if (!isVisible(dot.lng, dot.lat)) return;
    const proj = projection([dot.lng, dot.lat]);
    if (!proj) return;
    const col = dotColor(dot.iso3);
    if (dot.iso3 === args.selected_iso) sel.push(proj);
    else if (col) bright.push({ proj, col });
    else dim.push(proj);
  });

  // Dim dots (no articles)
  ctx.fillStyle = 'rgba(60,70,90,0.55)';
  ctx.beginPath();
  dim.forEach(([px, py]) => {
    ctx.moveTo(px + 1.4, py);
    ctx.arc(px, py, 1.4, 0, 2 * Math.PI);
  });
  ctx.fill();

  // Colored dots (has articles) — group by color string
  const byCol = new Map();
  bright.forEach(({ proj, col }) => {
    const key = col.join(',');
    if (!byCol.has(key)) byCol.set(key, { col, pts: [] });
    byCol.get(key).pts.push(proj);
  });
  byCol.forEach(({ col, pts }) => {
    ctx.fillStyle = `rgb(${col.join(',')})`;
    ctx.beginPath();
    pts.forEach(([px, py]) => {
      ctx.moveTo(px + 1.4, py);
      ctx.arc(px, py, 1.4, 0, 2 * Math.PI);
    });
    ctx.fill();
  });

  // Selected dots (yellow)
  if (sel.length) {
    ctx.fillStyle = 'rgb(255,214,10)';
    ctx.beginPath();
    sel.forEach(([px, py]) => {
      ctx.moveTo(px + 1.8, py);
      ctx.arc(px, py, 1.8, 0, 2 * Math.PI);
    });
    ctx.fill();

    // Golden outline for selected country
    const selFeat = countryFeatures.find(f => f.properties.ISO_A3 === args.selected_iso);
    if (selFeat) {
      ctx.beginPath();
      pathGen(selFeat);
      ctx.strokeStyle = 'rgba(255,214,10,0.75)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }
}

// ── Dot generation ────────────────────────────────────────────────────────────
const DOT_STEP = 1.4; // degrees between dots

function generateDots(feature) {
  const iso3 = feature.properties.ISO_A3;
  if (!iso3 || iso3 === '-99') return [];
  const [[minLng, minLat], [maxLng, maxLat]] = d3.geoBounds(feature);
  const dots = [];
  for (let lng = minLng; lng <= maxLng; lng += DOT_STEP) {
    for (let lat = minLat; lat <= maxLat; lat += DOT_STEP) {
      if (d3.geoContains(feature, [lng, lat])) {
        dots.push({ lng, lat, iso3 });
      }
    }
  }
  return dots;
}

// ── Hit detection ─────────────────────────────────────────────────────────────
function featureAt(cx, cy) {
  const lnglat = projection.invert([cx, cy]);
  if (!lnglat) return null;
  if (!isVisible(lnglat[0], lnglat[1])) return null;
  return countryFeatures.find(f => d3.geoContains(f, lnglat)) || null;
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

function showTooltip(feat, mx, my) {
  const iso3 = feat.properties.ISO_A3;
  const name = (args.iso_to_name && args.iso_to_name[iso3]) || feat.properties.ADMIN || iso3;
  const c    = (args.iso_counts && args.iso_counts[iso3]) || 0;
  tooltip.innerHTML = `<b>${name}</b>${c ? `<br/><span style="color:#adb5bd">${c} article${c > 1 ? 's' : ''}</span>` : ''}`;
  const tx = Math.min(mx + 14, W - 160);
  const ty = Math.max(my - 12, 4);
  tooltip.style.left    = tx + 'px';
  tooltip.style.top     = ty + 'px';
  tooltip.style.display = 'block';
}

// ── Drag & click ──────────────────────────────────────────────────────────────
let isDragging = false;
let dragStart  = null;
let rotStart   = null;
let dragMoved  = false;

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragMoved  = false;
  autoRotate = false;
  dragStart  = [e.clientX, e.clientY];
  rotStart   = [...rotation];
  canvas.style.cursor = 'grabbing';
  tooltip.style.display = 'none';
});

document.addEventListener('mousemove', e => {
  if (!isDragging || !dragStart) return;
  const dx = e.clientX - dragStart[0];
  const dy = e.clientY - dragStart[1];
  if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
  rotation[0] = rotStart[0] + dx * 0.35;
  rotation[1] = Math.max(-75, Math.min(75, rotStart[1] - dy * 0.35));
  projection.rotate(rotation);
  render();
});

document.addEventListener('mouseup', e => {
  if (!isDragging) return;
  isDragging = false;
  canvas.style.cursor = 'grab';

  if (!dragMoved) {
    const rect = canvas.getBoundingClientRect();
    const feat = featureAt(e.clientX - rect.left, e.clientY - rect.top);
    if (feat) {
      const iso3   = feat.properties.ISO_A3;
      const newSel = (iso3 && iso3 !== '-99') ? ((iso3 === args.selected_iso) ? null : iso3) : null;
      setComponentValue({ country: newSel, ts: Date.now() });
    } else {
      setComponentValue({ country: null, ts: Date.now() });
    }
  }
  setTimeout(() => { autoRotate = true; }, 300);
});

// Hover tooltip (throttled to rAF)
let hoverPending = false;
canvas.addEventListener('mousemove', e => {
  if (isDragging) return;
  if (hoverPending) return;
  hoverPending = true;
  requestAnimationFrame(() => {
    hoverPending = false;
    const rect = canvas.getBoundingClientRect();
    const mx   = e.clientX - rect.left;
    const my   = e.clientY - rect.top;
    const feat = featureAt(mx, my);
    if (feat) {
      showTooltip(feat, mx, my);
      canvas.style.cursor = 'pointer';
    } else {
      tooltip.style.display = 'none';
      canvas.style.cursor   = 'grab';
    }
  });
});

canvas.addEventListener('mouseleave', () => {
  tooltip.style.display = 'none';
  canvas.style.cursor   = 'grab';
});

// ── Auto-rotation ─────────────────────────────────────────────────────────────
d3.timer(() => {
  if (autoRotate) {
    rotation[0] += 0.22;
    projection.rotate(rotation);
    render();
  }
});

// ── Load GeoJSON & generate dots ──────────────────────────────────────────────
fetch('https://cdn.jsdelivr.net/gh/vasturiano/globe.gl@master/example/datasets/ne_110m_admin_0_countries.geojson')
  .then(r => r.json())
  .then(data => {
    countryFeatures = data.features;
    allDots = countryFeatures.flatMap(generateDots);
    render();
  })
  .catch(err => console.error('[globe] GeoJSON load failed:', err));

// ── Streamlit messages ────────────────────────────────────────────────────────
window.addEventListener('message', e => {
  if (!e.data || e.data.type !== 'streamlit:render') return;
  args = e.data.args || args;
  render();
});

window.addEventListener('load', () => {
  setFrameHeight(460);
  componentReady();
  canvas.style.cursor = 'grab';
});
</script>
</body>
</html>
